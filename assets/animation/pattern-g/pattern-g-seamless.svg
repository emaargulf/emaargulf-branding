<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 408.18 408.18">
  <title>Gold Bracket Seamless Pattern</title>
  <defs>

    <!--
      Tile: 68.03 × 68.03
      Motif repeat: every 34.015 on a diagonal checkerboard
      Two motif instances per tile:
        Motif A — origin (0, 0)
        Motif B — origin (34.015, 34.015)
      Plus four edge-wrap fragments to close seams:
        from left-adjacent tile's Motif B  → translate(-34.015, 34.015)
        from top-adjacent  tile's Motif B  → translate( 34.015,-34.015)
    -->

    <pattern id="brackets"
             x="0" y="0"
             width="68.03" height="68.03"
             patternUnits="userSpaceOnUse">

      <!-- ── Motif A  (0, 0) ─────────────────────────────── -->
      <path fill="#F1AA27" d="M22.18 26.01v16.3l-4.67 4.67v-16.3H1.21l4.67-4.67h16.3
                               M22.68 25.51H5.67L0 31.18h17.01v17.01l5.67-5.67v-17.01Z"/>
      <path fill="#F1AA27" d="M42.31 26.01l4.67 4.67h-16.3v16.3l-4.67-4.67v-16.3h16.3
                               M42.52 25.51h-17.01v17.01l5.67 5.67v-17.01h17.01l-5.67-5.67Z"/>
      <path fill="#F1AA27" d="M17.51 1.21l4.67 4.67v16.3H5.88l-4.67-4.67h16.3V1.21
                               M17.01 0v17.01H0l5.67 5.67h17.01V5.67L17.01 0Z"/>
      <path fill="#F1AA27" d="M30.68 1.21v16.3h16.3l-4.67 4.67h-16.3V5.88l4.67-4.67
                               M31.18 0l-5.67 5.67v17.01h17.01l5.67-5.67h-17.01V0Z"/>

      <!-- ── Motif B  (34.015, 34.015) ─────────────────────── -->
      <path fill="#F1AA27" transform="translate(34.015,34.015)"
            d="M22.18 26.01v16.3l-4.67 4.67v-16.3H1.21l4.67-4.67h16.3
               M22.68 25.51H5.67L0 31.18h17.01v17.01l5.67-5.67v-17.01Z"/>
      <path fill="#F1AA27" transform="translate(34.015,34.015)"
            d="M42.31 26.01l4.67 4.67h-16.3v16.3l-4.67-4.67v-16.3h16.3
               M42.52 25.51h-17.01v17.01l5.67 5.67v-17.01h17.01l-5.67-5.67Z"/>
      <path fill="#F1AA27" transform="translate(34.015,34.015)"
            d="M17.51 1.21l4.67 4.67v16.3H5.88l-4.67-4.67h16.3V1.21
               M17.01 0v17.01H0l5.67 5.67h17.01V5.67L17.01 0Z"/>
      <path fill="#F1AA27" transform="translate(34.015,34.015)"
            d="M30.68 1.21v16.3h16.3l-4.67 4.67h-16.3V5.88l4.67-4.67
               M31.18 0l-5.67 5.67v17.01h17.01l5.67-5.67h-17.01V0Z"/>

      <!-- ── Edge wraps: left tile's Motif B ────────────────── -->
      <!-- TR bracket → visible strip at x:[0,14] y:[51,57] -->
      <path fill="#F1AA27" transform="translate(-34.015,34.015)"
            d="M30.68 1.21v16.3h16.3l-4.67 4.67h-16.3V5.88l4.67-4.67
               M31.18 0l-5.67 5.67v17.01h17.01l5.67-5.67h-17.01V0Z"/>
      <!-- BR bracket → visible strip at x:[0,14] y:[60,65] -->
      <path fill="#F1AA27" transform="translate(-34.015,34.015)"
            d="M42.31 26.01l4.67 4.67h-16.3v16.3l-4.67-4.67v-16.3h16.3
               M42.52 25.51h-17.01v17.01l5.67 5.67v-17.01h17.01l-5.67-5.67Z"/>

      <!-- ── Edge wraps: top tile's Motif B ─────────────────── -->
      <!-- BL bracket → visible strip at x:[51,57] y:[0,14] -->
      <path fill="#F1AA27" transform="translate(34.015,-34.015)"
            d="M22.18 26.01v16.3l-4.67 4.67v-16.3H1.21l4.67-4.67h16.3
               M22.68 25.51H5.67L0 31.18h17.01v17.01l5.67-5.67v-17.01Z"/>
      <!-- BR bracket → visible strip at x:[60,65] y:[0,14] -->
      <path fill="#F1AA27" transform="translate(34.015,-34.015)"
            d="M42.31 26.01l4.67 4.67h-16.3v16.3l-4.67-4.67v-16.3h16.3
               M42.52 25.51h-17.01v17.01l5.67 5.67v-17.01h17.01l-5.67-5.67Z"/>

    </pattern>
  </defs>

  <!-- Background -->
  <rect width="408.18" height="408.18" fill="#FFFFFF"/>
  <!-- Pattern fill -->
  <rect width="408.18" height="408.18" fill="url(#brackets)"/>
</svg>
